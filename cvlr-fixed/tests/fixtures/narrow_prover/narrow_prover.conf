// Prover rules for NarrowFixedU128. The inlining and summary files are the
// standard ones for CVLR programs. From this directory:
//   cargo certora-sbf --manifest-path Cargo.toml --features certora
//   certoraSolanaProver narrow_prover.conf
{
    "files": ["target/sbpf-solana-solana/release/narrow_prover_fixture.so"],
    "msg": "NarrowFixedU128 native paths",
    "loop_iter": 2,
    "optimistic_loop": false,
    "rule_sanity": "basic",
    "solana_inlining": ["cvlr_inlining.txt"],
    "solana_summaries": ["cvlr_summaries.txt"],
    "prover_args": [
        "-solanaTACMathInt true",
        "-solanaSkipCallRegInst true",
        "-solanaTACOptimize 2"
    ],
    "rule": [
        "narrow_add",
        "narrow_sub",
        "narrow_mul_checked",
        "narrow_mul_saturating",
        "narrow_mul_operator",
        "narrow_div_checked",
        "narrow_div_operator",
        "narrow_mul_int",
        "narrow_div_int",
        "narrow_from_bits",
        "narrow_to_bits",
        "narrow_ceil_round",
        "narrow_from_int",
        "narrow_from_fixed",
        "narrow_to_num_and_compare",
        "narrow_to_wide"
    ]
}
