// Prover rules for NarrowFixedU128, without -solanaTACSoundSignedMath: in
// this mode the Prover reads a negative immediate as a 256-bit value, so these
// runs show the crate does not depend on that flag.
// narrow_prover_sound_signed.conf runs the same rules with it on.
//
// No CI job runs these rules: rerun both confs by hand after any change to
// cvlr-fixed/src/narrow.rs. Every rule must be verified, `check_*` rules with
// their vacuity checks and `reach_*` rules as satisfied witnesses.
//
// The inlining and summary files are the standard ones for CVLR programs.
// From this directory:
//   cargo certora-sbf --manifest-path Cargo.toml --features certora
//   certoraSolanaProver narrow_prover.conf
//   certoraSolanaProver narrow_prover_sound_signed.conf
