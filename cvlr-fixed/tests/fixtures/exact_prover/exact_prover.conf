// Prover rules for ExactFixedU128, without -solanaTACSoundSignedMath: in this
// mode the Prover reads a negative immediate as a 256-bit value, so these runs
// show the crate does not depend on that flag.
// exact_prover_sound_signed.conf runs the same rules with it on.
//
// No CI job runs these rules: rerun both confs by hand after any change to
// cvlr-fixed/src/exact.rs. Every `spec_*` rule must be verified, with its
// vacuity check except the `*_overflow_panics` rules, whose sanity check
// fails by design (see src/lib.rs); every `reach_*` rule must be satisfied.
//
// From this directory:
//   cargo certora-sbf --manifest-path Cargo.toml --features certora
//   certoraSolanaProver exact_prover.conf
//   certoraSolanaProver exact_prover_sound_signed.conf
{
    "files": [
        "target/sbpf-solana-solana/release/exact_prover_fixture.so"
    ],
    "msg": "ExactFixedU128 native paths",
    "loop_iter": 2,
    "optimistic_loop": false,
    "rule_sanity": "basic",
    "solana_inlining": [
        "cvlr_inlining.txt"
    ],
    "solana_summaries": [
        "cvlr_summaries.txt"
    ],
    "prover_args": [
        "-solanaTACMathInt true",
        "-solanaSkipCallRegInst true",
        "-solanaTACOptimize 2"
    ],
    "rule": [
        "spec_mul_u60",
        "spec_from_num_u60",
        "spec_from_u64_u60",
        "spec_cmp_u64_u60",
        "spec_cmp_u128_u60",
        "spec_cmp_i64_u60",
        "reach_cmp_i64_negative_u60",
        "reach_cmp_i64_zero_u60",
        "reach_cmp_i64_positive_equal_u60",
        "spec_rounding_u60",
        "spec_ceil_overflow_panics_u60",
        "spec_round_overflow_panics_u60",
        "reach_ceil_overflows_u60",
        "reach_round_overflows_u60",
        "spec_div_u60",
        "spec_mul_forms_u60",
        "spec_div_forms_u60",
        "spec_checked_div_by_zero_u60",
        "spec_mul_operator_u60",
        "spec_mul_operator_overflow_panics_u60",
        "spec_div_operator_u60",
        "spec_div_operator_overflow_panics_u60",
        "reach_mul_fits_large_u60",
        "reach_mul_overflows_u60",
        "reach_div_fits_large_u60",
        "reach_div_overflows_u60",
        "spec_mul_u0",
        "spec_to_num_u0",
        "spec_from_num_u0",
        "spec_from_u64_u0",
        "spec_cmp_u64_u0",
        "spec_cmp_u128_u0",
        "spec_cmp_i64_u0",
        "reach_cmp_i64_negative_u0",
        "reach_cmp_i64_zero_u0",
        "reach_cmp_i64_positive_equal_u0",
        "spec_rounding_u0",
        "spec_div_u0",
        "spec_mul_forms_u0",
        "spec_div_forms_u0",
        "spec_checked_div_by_zero_u0",
        "spec_mul_operator_u0",
        "spec_mul_operator_overflow_panics_u0",
        "spec_div_operator_u0",
        "reach_mul_fits_large_u0",
        "reach_mul_overflows_u0",
        "reach_div_fits_large_u0",
        "spec_mul_u127",
        "spec_to_num_u127",
        "spec_cmp_u64_u127",
        "spec_cmp_u128_u127",
        "spec_cmp_i64_u127",
        "reach_cmp_i64_negative_u127",
        "reach_cmp_i64_zero_u127",
        "reach_cmp_i64_positive_equal_u127",
        "spec_rounding_u127",
        "spec_ceil_overflow_panics_u127",
        "spec_round_overflow_panics_u127",
        "reach_ceil_overflows_u127",
        "reach_round_overflows_u127",
        "spec_div_u127",
        "spec_mul_forms_u127",
        "spec_div_forms_u127",
        "spec_checked_div_by_zero_u127",
        "spec_mul_operator_u127",
        "spec_mul_operator_overflow_panics_u127",
        "spec_div_operator_u127",
        "spec_div_operator_overflow_panics_u127",
        "reach_mul_fits_large_u127",
        "reach_mul_overflows_u127",
        "reach_div_fits_large_u127",
        "reach_div_overflows_u127",
        "spec_mul_u128",
        "spec_div_u128",
        "spec_mul_operator_u128",
        "spec_div_operator_u128",
        "spec_div_operator_overflow_panics_u128",
        "spec_cmp_u64_u128",
        "spec_cmp_i64_u128",
        "spec_rounding_u128",
        "spec_ceil_overflow_panics_u128",
        "spec_round_overflow_panics_u128",
        "reach_ceil_overflows_u128",
        "reach_round_overflows_u128",
        "reach_div_fits_large_u128",
        "reach_div_overflows_u128"
    ]
}
