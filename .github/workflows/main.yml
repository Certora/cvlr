name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Run cargo check
        if: success() || failure()
        run: cargo check
      - name: Check code formatting
        if: success() || failure()
        run: cargo fmt -- --check
      - name: Run Clippy
        if: success() || failure()
        run: cargo clippy --features cvlr-fixed/fixed -- --deny warnings
      - name: Check documentation
        if: success() || failure()
        run: cargo doc --no-deps --workspace --all-features
        env:
          RUSTDOCFLAGS: "-D warnings -D missing_docs"

  testing:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install cargo-expand
        run: cargo install cargo-expand --version 1.0.126 --locked
      - name: Install cargo-certora-sbf
        if: runner.os == 'Linux'
        run: cargo install cargo-certora-sbf --version 0.3.5 --locked
      - name: Install Certora platform tools v1.43
        if: runner.os == 'Linux'
        run: cargo certora-sbf --no-build --no-rustup --tools-version v1.43
      - name: Run cargo test
        run: cargo test --verbose
      # The fixtures' rules run on the Prover by hand (see each conf's header);
      # this keeps them building. Their dependencies need a newer rustc than
      # the v1.43 tools ship, and their confs read v1.53's output directory.
      - name: Build Prover fixtures
        if: runner.os == 'Linux'
        run: |
          for manifest in cvlr-fixed/tests/fixtures/*/Cargo.toml; do
            cargo certora-sbf --tools-version v1.53 --manifest-path "$manifest" --features certora
          done
